name: Agenda Diaria NBB - EAV Prod (WhatsApp)

on:
  schedule:
    # Roda todos os dias as 09:00 BRT (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite rodar manualmente com 1 clique para testar

jobs:
  render-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar fontes e dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-liberation ffmpeg
          pip install opencv-python-headless pillow numpy requests beautifulsoup4

      - name: Buscar Agenda LNB e Renderizar MP4 (1080x1920)
        run: python src/generate_story.py

      - name: Disparar Video MP4 para o WhatsApp (+55 21 96744-7902)
        env:
          WHATSAPP_PHONE: "5521967447902"
          API_URL: ${{ secrets.WHATSAPP_API_URL }}
          API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: python src/send_whatsapp.py

      - name: Salvar MP4 nos Artefatos do GitHub (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: story-nbb-mp4
          path: output/story_hoje.mp4
